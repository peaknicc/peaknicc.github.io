<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PEAK 허허</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Corben:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow mobile column — big faded photo, icon row, EP card that spreads 7 store icons on tap, MV card, links */
:root{
  --bg:#1c241b; --bg-2:#2d3a2a; --btn:#3f5937; --btn-hover:#4a6841;
  --fg:#f1eee2; --muted:#b9c2ad; --line:rgba(241,238,226,.16);
  --display:"Corben","IBM Plex Sans KR",Georgia,serif;
  --body:"Corben","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--fg);font-family:var(--body);
  background:radial-gradient(120% 60% at 50% 0%, var(--bg-2) 0%, transparent 70%),var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;
}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}

.hero{position:relative;width:calc(100% + 32px);margin:0 -16px -6px;aspect-ratio:1/1;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block;
  -webkit-mask-image:linear-gradient(to bottom,#000 45%,transparent 96%);mask-image:linear-gradient(to bottom,#000 45%,transparent 96%)}
.hero-text{position:absolute;left:0;right:0;bottom:6%;text-align:center}
@media (min-width:500px){.hero{width:100%;margin:0 0 -6px;border-radius:24px 24px 0 0}}
h1{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:.04em;margin:0;text-shadow:0 2px 16px rgba(0,0,0,.45)}

/* SNS: identical round buttons, logo only */
.social{display:flex;gap:12px;justify-content:center;margin:0 0 8px}
.social a{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .15s ease}
.social a:hover,.social a:focus-visible{background:var(--line);outline:none}
.social img{display:block;width:24px;height:24px;object-fit:contain}
.social img.ig{border-radius:6px}

/* EP card */
.feature{width:100%;background:var(--btn);border-radius:20px;padding:14px}
.feature-head{all:unset;box-sizing:border-box;width:100%;display:flex;gap:14px;align-items:center;cursor:pointer;border-radius:12px}
.feature-head:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
.feature-head img{width:88px;height:88px;border-radius:12px;object-fit:cover;flex-shrink:0;transition:transform .25s ease}
.feature-head:hover img{transform:scale(1.03)}
.feature-head .txt{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.badge{display:inline-block;font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--fg);border-radius:999px;padding:2px 9px}
.feature h2{font-family:var(--display);font-size:32px;margin:8px 0 0;line-height:1.1;color:var(--fg)}
.feature h2 span{font-size:16px;color:var(--muted);font-weight:400}
.feature-head .txt{flex:1}
.chev{flex-shrink:0;width:12px;height:12px;margin:0 8px 0 4px;border-right:2px solid var(--fg);border-bottom:2px solid var(--fg);transform:rotate(45deg) translate(-3px,-3px);transition:transform .3s ease}
.feature.open .chev{transform:rotate(-135deg) translate(-3px,-3px)}
.hint{font-family:var(--ko);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.hint i{display:inline-block;width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .3s ease}
.feature.open .hint i{transform:rotate(-135deg) translateY(-1px)}

.dsp{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-height:0;overflow:hidden;transition:max-height .35s ease,margin-top .35s ease}
.feature.open .dsp{max-height:80px;margin-top:14px}
.dsp a{--i:0;display:block;aspect-ratio:1/1;max-width:44px;width:100%;margin:0 auto;border-radius:11px;overflow:hidden;background:#fff;
  opacity:0;transform:translateX(calc(var(--i) * -100%)) scale(.5);
  transition:transform .45s cubic-bezier(.2,.8,.2,1.2),opacity .3s ease;transition-delay:calc(var(--i) * 45ms)}
.feature.open .dsp a{opacity:1;transform:none}
.dsp a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.dsp img{width:100%;height:100%;display:block;object-fit:cover}
.dsp a.glyph img{object-fit:contain;padding:14%}
.dsp a.dark{background:#121212}

/* MV */
.mv{width:100%;display:block;text-decoration:none;color:var(--fg);background:var(--btn);border-radius:20px;overflow:hidden;transition:background .15s ease}
.mv:hover,.mv:focus-visible{background:var(--btn-hover);outline:none}
.mv-thumb{position:relative;aspect-ratio:16/9;background:var(--bg)}
.mv-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mv-thumb .play{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(28,36,27,.78);display:grid;place-items:center}
.mv-thumb .play svg{width:20px;height:20px;fill:var(--fg);margin-left:3px}
.mv-cap{padding:12px 16px;font-size:14px}

.links{width:100%;display:flex;flex-direction:column;gap:12px}
.link{position:relative;display:flex;align-items:center;justify-content:center;min-height:56px;background:var(--btn);color:var(--fg);text-decoration:none;border-radius:16px;padding:10px 24px;text-align:center;font-family:var(--display);font-size:14px;line-height:1.35;transition:transform .15s ease,background .15s ease}
.link:hover,.link:focus-visible{background:var(--btn-hover);transform:scale(1.015);outline:none}
.link .sub-logo{display:block;height:13px;width:auto;margin:5px auto 0}

@media (prefers-reduced-motion:reduce){
  .link,.mv,.dsp,.dsp a,.feature-head img,.chev{transition:none!important}
  .link:hover{transform:none}
}
</style>

</head>
