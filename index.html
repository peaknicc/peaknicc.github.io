<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PEAK 허허</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Corben:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* Layout: one narrow mobile column, Linktree-style stack, new EP card featured on top */
:root{
  --bg:#1c241b; --bg-2:#2d3a2a; --btn:#3f5937; --btn-hover:#4a6841;
  --fg:#f1eee2; --muted:#b9c2ad; --line:rgba(241,238,226,.14);
  --display:"Corben","Gowun Batang",Georgia,serif;
  --body:"Gowun Batang","Corben",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--fg);font-family:var(--body);
  background:
    radial-gradient(120% 60% at 50% 0%, var(--bg-2) 0%, transparent 70%),
    var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:40px 32px;
}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:78% 45%;border:2px solid var(--line)}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.04em;margin:4px 0 0}
.tag{margin:0;color:var(--muted);font-size:15px}
.social{display:flex;gap:18px;margin:2px 0 10px}
.social a{color:var(--fg);display:grid;place-items:center;width:32px;height:32px;border-radius:50%}
.social a:hover,.social a:focus-visible{background:var(--line);outline:none}
.social svg{width:24px;height:24px;fill:currentColor}

.feature{width:100%;background:var(--btn);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:14px}
.feature-head{display:flex;gap:14px;align-items:center}
.feature-head img{width:96px;height:96px;border-radius:12px;object-fit:cover;flex-shrink:0}
.feature-head div{min-width:0}
.badge{display:inline-block;font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--fg);border-radius:999px;padding:2px 9px}
.feature h2{font-family:var(--display);font-size:24px;margin:6px 0 2px;line-height:1.15}
.feature h2 span{font-size:15px;color:var(--muted);font-weight:400}
.feature p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.dsp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dsp a{background:var(--bg);color:var(--fg);text-decoration:none;text-align:center;padding:12px 8px;border-radius:12px;font-size:14px;font-weight:700}
.dsp a:hover,.dsp a:focus-visible{background:var(--bg-2);outline:2px solid var(--fg);outline-offset:-2px}

.links{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:4px}
.link{
  position:relative;display:flex;align-items:center;justify-content:center;min-height:56px;
  background:var(--btn);color:var(--fg);text-decoration:none;border-radius:16px;
  padding:10px 64px;text-align:center;font-family:var(--display);font-size:14px;line-height:1.35;
  transition:transform .15s ease,background .15s ease;
}
.link:hover,.link:focus-visible{background:var(--btn-hover);transform:scale(1.015);outline:none}
.link small{display:block;font-family:var(--body);font-size:11px;color:var(--muted)}
.link .thumb{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:10px;object-fit:cover}
.link .play{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center}
.link .play svg{width:16px;height:16px;fill:var(--fg)}

.tracks{width:100%;margin-top:10px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:13px;text-align:center;line-height:1.9}
.tracks strong{display:block;font-family:var(--display);color:var(--fg);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
footer{color:var(--muted);font-size:12px;margin-top:8px;text-align:center}
@media (prefers-reduced-motion:reduce){.link{transition:none}.link:hover{transform:none}}
</style>

</head>
